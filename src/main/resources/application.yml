server:
  port: 8080

spring:
  application:
    name: drogonStart

  datasource:
    url: jdbc:postgresql://localhost:5432/scaffolder_db
    username: scaffolder
    password: passwordforpostgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# AWS configuration (for local development, uses ~/.aws/credentials or env vars)
aws:
  region: "ap-south-1"
  lambda:
    function-name: "drogon-scaffold"
  s3:
    bucket: "drogon-scaffolds"

# Workspace configuration (local temp dir for extracting/patching projects)
scaffolding:
  workspace-base: "/tmp/drogon-workspaces"
  cleanup-delay-minutes: 60
  max-concurrent-jobs: 5

logging:
  level:
    com.ayush.drogonStart: DEBUG