version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: drogon-postgres
    environment:
      POSTGRES_USER: scaffolder
      POSTGRES_PASSWORD: REMOVED
      POSTGRES_DB: scaffolder_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: